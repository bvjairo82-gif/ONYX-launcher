name: Generar APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar código
        uses: actions/checkout@v3

      - name: Instalar Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Descargar dependencias
        run: cd flutter_onyx_launcher && flutter pub get

      - name: Construir APK
        run: cd flutter_onyx_launcher && flutter build apk

      - name: Subir APK para descargar
        uses: actions/upload-artifact@v3
        with:
          name: LauncherAPK
          path: flutter_onyx_launcher/build/app/outputs/flutter-apk/app-release.apk
