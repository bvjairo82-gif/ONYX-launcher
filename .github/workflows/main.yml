name: Generar APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar código
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Magia en la nube (Reparar y convertir en Launcher)
        run: |
          cd flutter_onyx_launcher
          rm -rf android
          flutter create .
          sed -i 's|android.intent.category.LAUNCHER|android.intent.category.HOME" />\n                <category android:name="android.intent.category.DEFAULT|g' android/app/src/main/AndroidManifest.xml
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/g' android/app/build.gradle.kts || true
          sed -i 's/compileSdk flutter.compileSdkVersion/compileSdk 34/g' android/app/build.gradle.kts || true
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/g' android/app/build.gradle || true
          sed -i 's/compileSdk flutter.compileSdkVersion/compileSdk 34/g' android/app/build.gradle || true
          flutter pub get

      - name: Construir APK
        run: cd flutter_onyx_launcher && flutter build apk

      - name: Subir APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: LauncherAPK
          path: flutter_onyx_launcher/build/app/outputs/flutter-apk/app-release.apk
