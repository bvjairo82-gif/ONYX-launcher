name: Generar APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar código
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Magia en la nube (Reparar y convertir en Launcher)
        run: |
          cd flutter_onyx_launcher
          rm -rf android
          flutter create --platforms=android .
          sed -i 's|android.intent.category.LAUNCHER|android.intent.category.HOME" />\n                <category android:name="android.intent.category.DEFAULT|g' android/app/src/main/AndroidManifest.xml
          
          # Actualizar plugins a sus versiones modernas (Arregla el battery_plus)
          flutter pub upgrade
          
          # Fuerza bruta absoluta a cualquier plugin rebelde en la memoria caché
          find ~/.pub-cache -type f -name "build.gradle*" -exec sed -i 's/compileSdkVersion 33/compileSdkVersion 36/g' {} + || true
          find ~/.pub-cache -type f -name "build.gradle*" -exec sed -i 's/compileSdk 33/compileSdk 36/g' {} + || true

      - name: Construir APK
        run: cd flutter_onyx_launcher && flutter build apk

      - name: Subir APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: LauncherAPK
          path: flutter_onyx_launcher/build/app/outputs/flutter-apk/app-release.apk
